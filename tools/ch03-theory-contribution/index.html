<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Theory Contribution Builder</title>
<style>
:root{
  --bg:#f6f8fb; --panel:#ffffff; --ink:#172033; --muted:#5e6b82; --line:#d9e0ec; --blue:#1f5d8f; --blue2:#17486f; --light:#eaf3fb; --accent:#d97b2b; --good:#1d7a4d; --warn:#9b6a04; --bad:#a83232; --shadow:0 12px 32px rgba(23,32,51,.10); --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#f3f7fb 0%,#eef3f8 100%);font-family:Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:var(--ink);line-height:1.45}
a{color:var(--blue)}
header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:28px 34px 20px;box-shadow:var(--shadow);position:sticky;top:0;z-index:10}
.header-grid{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center;max-width:1480px;margin:0 auto}
h1{margin:0;font-size:clamp(1.6rem,2.8vw,2.7rem);letter-spacing:-.03em;line-height:1.05}.tagline{margin:.55rem 0 0;max-width:980px;color:#eaf3fb;font-size:1rem}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}.btn,button{border:0;border-radius:999px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}.btn.secondary,button.secondary{background:#fff;color:var(--blue2)}.btn.ghost,button.ghost{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.38)}.btn.warn{background:var(--accent)}button:focus,input:focus,textarea:focus,select:focus{outline:3px solid rgba(217,123,43,.35);outline-offset:2px}
.progress-wrap{max-width:1480px;margin:18px auto 0}.progress-label{font-size:.82rem;color:#eaf3fb;margin-bottom:6px;display:flex;justify-content:space-between}.progress-bar{height:9px;border-radius:999px;background:rgba(255,255,255,.23);overflow:hidden}.progress-fill{height:100%;width:0%;background:#fff;border-radius:999px;transition:.25s ease}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:24px;max-width:1480px;margin:24px auto;padding:0 24px 24px}
nav{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;position:sticky;top:154px;max-height:calc(100vh - 178px);overflow:auto}.nav-title{font-weight:900;color:var(--blue2);margin:6px 8px 12px}.nav-btn{width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none;margin:4px 0;border-radius:14px;display:flex;gap:10px;align-items:center;padding:10px}.nav-btn:hover{background:var(--light)}.nav-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}.nav-num{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;border-radius:50%;background:var(--light);color:var(--blue2);font-weight:900;font-size:.78rem}.nav-btn.active .nav-num{background:#fff;color:var(--blue2)}.nav-small{font-size:.76rem;color:var(--muted);margin:12px 8px}
main{min-width:0}.module{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}.module h2{margin:0 0 8px;font-size:1.72rem;color:var(--blue2);letter-spacing:-.02em}.intro{color:var(--muted);max-width:1050px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.full{grid-column:1/-1}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}.card.soft{background:#fbfcfe}.card h3{margin:0 0 8px;color:var(--blue2)}.card h4{margin:8px 0;color:#25324a}.field{margin:11px 0}.field label{display:block;font-weight:800;font-size:.92rem;margin-bottom:6px;color:#25324a}.hint{font-size:.82rem;color:var(--muted);margin-top:4px}input[type=text],input[type=number],textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;font:inherit;background:#fff;color:var(--ink)}textarea{min-height:92px;resize:vertical}.small-textarea{min-height:58px}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;background:#fff;margin:4px 4px 4px 0;font-size:.9rem}.pill input{margin:0}.status{display:inline-flex;padding:5px 10px;border-radius:999px;font-weight:900;font-size:.78rem}.status.good{background:#e7f6ee;color:var(--good)}.status.warn{background:#fff4d8;color:var(--warn)}.status.bad{background:#fdecec;color:var(--bad)}.callout{border-left:5px solid var(--blue);background:var(--light);padding:13px 15px;border-radius:12px;margin:14px 0;color:#233249}.callout.warn{border-left-color:var(--accent);background:#fff6eb}.callout.good{border-left-color:var(--good);background:#eaf8f1}.scorebox{display:grid;grid-template-columns:120px 1fr;gap:14px;align-items:center}.scorecircle{width:96px;height:96px;border-radius:50%;background:conic-gradient(var(--blue) 0deg,#e7edf5 0deg);display:flex;align-items:center;justify-content:center;color:var(--blue2);font-weight:900;font-size:1.55rem;margin:auto;border:8px solid #fff;box-shadow:0 0 0 1px var(--line)}details{border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;margin:10px 0}summary{font-weight:900;cursor:pointer;color:var(--blue2)}table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:10px;vertical-align:top}th{background:var(--blue2);color:#fff;text-align:left}tr:last-child td{border-bottom:0}td:last-child,th:last-child{border-right:0}.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:15px 0}.flow .node{background:#fff;border:2px solid var(--blue);border-radius:16px;padding:12px;min-width:140px;text-align:center;font-weight:800}.flow .arrow{font-size:1.4rem;color:var(--blue2);font-weight:900}.tree{display:grid;grid-template-columns:1fr 1fr;gap:14px}.tree .q{border-left:4px solid var(--blue);background:#fff;padding:14px;border-radius:14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.tree .rec{border-left:4px solid var(--accent);background:#fff8ef;padding:14px;border-radius:14px;border-top:1px solid #f0d3b4;border-right:1px solid #f0d3b4;border-bottom:1px solid #f0d3b4}.range-wrap{display:grid;grid-template-columns:1fr 48px;gap:10px;align-items:center}input[type=range]{width:100%}.report{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.report h3{border-bottom:1px solid var(--line);padding-bottom:6px}.report p{white-space:pre-wrap}.mini{font-size:.84rem;color:var(--muted)}.citation{font-size:.86rem;color:#4c596d}.hidden{display:none!important}
@media (max-width:960px){.layout{grid-template-columns:1fr}.header-grid{grid-template-columns:1fr}.toolbar{justify-content:flex-start}nav{position:static;max-height:none}.grid,.grid3,.grid4,.tree{grid-template-columns:1fr}.scorebox{grid-template-columns:1fr}.module{padding:18px}}
@media print{header,nav,.toolbar,.no-print{display:none!important}.layout{display:block;margin:0;padding:0}.module{box-shadow:none;border:0;padding:0}.card,details{break-inside:avoid}body{background:#fff}.report{border:0;padding:0}.print-only{display:block!important}}
</style>
</head>
<body>
<header>
  <div class="header-grid">
    <div>
      <h1>Theory Contribution Builder</h1>
      <p class="tagline">An interactive research-design tool for rigorous, credible, and impactful contributions to theory.</p>
    </div>
    <div class="toolbar no-print">
      <button class="secondary" id="saveBtn">Save progress</button>
      <button class="ghost" id="exportBtn">Export JSON</button>
      <button class="ghost" id="printBtn">Print / save PDF</button>
      <button class="ghost" id="copyBtn">Copy contribution</button>
      <button class="warn" id="resetBtn">Clear/reset</button>
    </div>
  </div>
  <div class="progress-wrap no-print">
    <div class="progress-label"><span>Completion</span><span id="progressText">0%</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
</header>
<div class="layout">
  <nav class="no-print">
    <div class="nav-title">Workflow modules</div>
    <div id="navList"></div>
    <div class="nav-small">Your work saves in this browser. Use Export JSON for a portable backup.</div>
  </nav>
  <main id="app"></main>
</div>
<script>
const STORAGE_KEY='theoryContributionBuilder.v1';
let state={};
let active=0;
const modules=[
 ['Intake','Research Idea Intake'],['Usefulness','Stakeholder Usefulness'],['Diagnostic','Good Theory Diagnostic'],['Unit/Program','Unit & Programmatic Theory'],['Need','Is New Theory Needed?'],['Pruning','Falsification Lab'],['Precision','Theoretical Precision'],['Route','Generation / Testing / Elaboration'],['Elaboration','Theory Elaboration Decision Tree'],['Scorecard','Five Ways to Advance Theory'],['Tactics','Implementation Tactics'],['Levels','Bridging Levels of Analysis'],['Methods','Methodological Implications'],['Statements','Contribution Statements'],['Report','Final Report']
];
const intakeFields=[
 ['title','Working title','text'],['phenomenon','Focal phenomenon','textarea'],['outcome','Main outcome or dependent variable','text'],['constructs','Main explanatory construct(s)','text'],['domain','Target literature/domain','text'],['audience','Intended audience','select',['Researchers','Managers/leaders','Students','Policymakers','Multiple audiences']],['problem','Practical problem or scientific puzzle','textarea'],['matters','Why the phenomenon matters','textarea'],['known','What is already known','textarea'],['unknown','What is not yet understood','textarea'],['currentTheory','Current theoretical explanation','textarea'],['candidate','Candidate contribution type','select',['Unclear yet','New theory','Theory elaboration','Theory testing','Construct refinement','Mechanism specification','Boundary condition','Level bridging','Falsification/pruning']]
];
const stakeholders=['Researchers','Managers/leaders','Students','Policymakers'];
const fiveCriteria=[
 ['constructValidity','Construct validity','Clear, distinguishable constructs with strong conceptual discriminant validity.','Construct specification: new specification or splitting.'],
 ['constructScope','Construct scope','Constructs capture the phenomenon sufficiently and parsimoniously.','Construct specification: refine breadth, dimensions, and boundaries.'],
 ['logicalAdequacy','Logical adequacy','The relationship logic is explicit, plausible, and coherent.','Contrasting: horizontal/vertical comparisons; structuring of mechanisms.'],
 ['empiricalAdequacy','Empirical adequacy','Theoretical relations fit observed realities across data, settings, time, or levels.','Contrasting across contexts/levels; strong inference design.'],
 ['explanPredict','Explanatory and predictive adequacy','The theory explains and predicts more accurately, with clearer mechanisms, timing, or recursion.','Structuring: specific, sequence, and recursive relations.']
];
const tacticChecks=[
 ['horiz','Horizontal contrasting','Same level of analysis; new organizational, industry, geographic, population, or temporal context.'],
 ['vert','Vertical contrasting','A theory is transferred or compared across individual, team, organization, field, or country levels.'],
 ['newSpec','New specification','A previously unspecified construct is needed to capture empirical reality.'],
 ['split','Construct splitting','A broad construct should be divided into sharper dimensions or subconstructs.'],
 ['specificRel','Specific relations','A focal relation, mechanism, mediation, moderation, nonlinearity, or boundary condition needs specification.'],
 ['sequence','Sequence relations','The outcome depends on temporal ordering, steps, stages, or probabilistic unfolding.'],
 ['recursive','Recursive relations','Constructs repeatedly influence each other through feedback loops or repeated interactions.']
];
function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function val(k){return state[k]||''}
function set(k,v){state[k]=v; updateAll(false)}
function field(k,label,type='textarea',opts=[]){let id='f_'+k;let value=val(k);if(type==='text')return `<div class="field"><label for="${id}">${label}</label><input id="${id}" data-key="${k}" type="text" value="${esc(value)}"></div>`;if(type==='number')return `<div class="field"><label for="${id}">${label}</label><input id="${id}" data-key="${k}" type="number" value="${esc(value)}"></div>`;if(type==='select')return `<div class="field"><label for="${id}">${label}</label><select id="${id}" data-key="${k}"><option value="">Choose…</option>${opts.map(o=>`<option ${value===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;return `<div class="field"><label for="${id}">${label}</label><textarea id="${id}" data-key="${k}">${esc(value)}</textarea></div>`}
function yesNo(k,label){let v=val(k);return `<div class="field"><label>${label}</label><span class="pill"><input type="radio" name="${k}" data-key="${k}" value="Yes" ${v==='Yes'?'checked':''}> Yes</span><span class="pill"><input type="radio" name="${k}" data-key="${k}" value="No" ${v==='No'?'checked':''}> No</span><span class="pill"><input type="radio" name="${k}" data-key="${k}" value="Unclear" ${v==='Unclear'?'checked':''}> Unclear</span></div>`}
function check(k,label,desc=''){let checked=!!state[k];return `<label class="pill"><input type="checkbox" data-key="${k}" ${checked?'checked':''}> <strong>${label}</strong>${desc?`<span class="mini"> — ${desc}</span>`:''}</label>`}
function rangeField(k,label){let v=state[k]??2;return `<div class="field"><label>${label}</label><div class="range-wrap"><input type="range" min="0" max="4" step="1" data-key="${k}" value="${v}"><strong>${v}/4</strong></div></div>`}
function statusFromScore(s,max){let pct=max? s/max:0; if(pct>=.75)return ['Strong','good']; if(pct>=.45)return ['Needs refinement','warn']; return ['High risk','bad'];}
function filledCount(){let keys=Object.keys(state);let filled=keys.filter(k=>state[k]!==''&&state[k]!==false&&state[k]!=null).length;let total=130;return Math.min(100,Math.round((filled/total)*100));}
function renderNav(){document.getElementById('navList').innerHTML=modules.map((m,i)=>`<button class="nav-btn ${i===active?'active':''}" onclick="go(${i})"><span class="nav-num">${i+1}</span><span>${m[1]}</span></button>`).join('')}
function go(i){active=i; render(); window.scrollTo({top:0,behavior:'smooth'});}
function moduleShell(title,intro,body){return `<section class="module"><h2>${title}</h2><p class="intro">${intro}</p>${body}</section>`}
function renderIntake(){let body=`<div class="callout"><strong>Goal:</strong> Convert a broad research idea into a theory-relevant problem with a clear phenomenon, causal logic, and “so what.”</div><div class="grid">${intakeFields.map(f=>field('intake_'+f[0],f[1],f[2],f[3]||[])).join('')}</div><details><summary>Examples of weak versus strong entries</summary><p><strong>Weak:</strong> “Leadership and performance.” This names a topic but not a phenomenon, mechanism, puzzle, or contribution.</p><p><strong>Stronger:</strong> “Why do transparent performance dashboards improve effort in some teams but produce gaming in others? The project explains the mechanism and boundary conditions connecting visibility, social comparison, and strategic behavior.”</p></details><div class="card soft"><h3>Live clarity check</h3>${clarityCheck()}</div>`;return moduleShell('1. Research Idea Intake','Start by specifying the phenomenon, theoretical conversation, focal constructs, and practical or scientific puzzle.',body)}
function clarityCheck(){let checks=[['What',val('intake_phenomenon')&&val('intake_outcome')],['How',val('intake_constructs')&&val('intake_currentTheory')],['Why',val('intake_unknown')&&val('intake_problem')],['So what',val('intake_matters')&&val('intake_audience')]];return checks.map(([n,ok])=>`<span class="status ${ok?'good':'warn'}">${n}: ${ok?'clear enough to develop':'needs detail'}</span>`).join(' ')+`<p class="hint">A strong theory contribution normally names what happens, how it happens, why it happens, and why it matters to a specific theoretical conversation and user community.</p>`}
function renderStakeholders(){let body=`<div class="callout"><strong>Goal:</strong> Pressure-test usefulness. Theory should help users understand, decide, teach, govern, or investigate more effectively.</div><div class="grid4">${stakeholders.map(s=>{let p=s.toLowerCase().replace(/[^a-z]/g,'');return `<div class="card"><h3>${s}</h3>${field('st_'+p+'_understand','What would they understand better?')}${field('st_'+p+'_decisions','What decisions/research/teaching/policies improve?')}${field('st_'+p+'_type','Useful, usable, or both?','select',['Useful','Usable','Both','Not yet clear'])}${field('st_'+p+'_boundaries','Boundary conditions that matter')}${field('st_'+p+'_effect','Meaningful effect size or practical consequence')}</div>`}).join('')}</div><div class="card soft"><h3>Stakeholder Usefulness Summary</h3><p id="stakeSummary">${stakeSummary()}</p></div>`;return moduleShell('2. Why Theory Matters / Stakeholder Usefulness Check','Identify who the theory serves and what kind of understanding, action, or governance it enables.',body)}
function stakeSummary(){let selected=stakeholders.map(s=>{let p=s.toLowerCase().replace(/[^a-z]/g,'');let u=val('st_'+p+'_understand');let d=val('st_'+p+'_decisions');return (u||d)?`${s}: ${u||'understanding to be specified'}; ${d||'use to be specified'}.`:''}).filter(Boolean);return selected.length?selected.join('\n'):'Complete the stakeholder fields to generate a usefulness summary.'}
function renderGoodTheory(){let items=[['gt_what','Explains what happens'],['gt_how','Explains how it happens'],['gt_why','Explains why it happens through clear because-logic'],['gt_nonobvious','Predicts something non-obvious'],['gt_unrecognized','Uncovers an unrecognized causal relationship'],['gt_enriches','Enriches a known relationship'],['gt_spurious','Discounts a spurious relationship'],['gt_constructs','Constructs are clear'],['gt_measures','Measures align with the theoretical argument'],['gt_design','Design fits the theory'],['gt_disconfirm','Evidence could support, disconfirm, or falsify'],['gt_effect','Practical significance is interpreted contextually']];let yes=items.filter(i=>state[i[0]]).length;let [lab,cls]=statusFromScore(yes,items.length);let body=`<div class="scorebox"><div class="scorecircle" style="background:conic-gradient(var(--blue) ${yes/items.length*360}deg,#e7edf5 0deg)">${yes}/${items.length}</div><div><span class="status ${cls}">${lab}</span><p class="hint">This diagnostic distinguishes a potentially good theory from a more developed theory whose explanation, prediction, and method alignment are sufficiently precise to be tested.</p></div></div><div class="grid">${items.map(([k,l])=>check(k,l)).join('')}</div>${field('gt_improve','Good Theory Improvement Plan: What needs to be clarified, specified, measured, or redesigned?')}<details><summary>Why this matters</summary><p>Good theory should explain and predict; it should also tell you what evidence is needed. A weak link between theory and method can prevent the theory from being tested even when the empirical work is sophisticated.</p></details>`;return moduleShell('3. Good Theory Diagnostic','Evaluate whether the theory explains accurately, predicts insightfully, aligns with methods, and yields contextually meaningful evidence.',body)}
function renderUnitProgram(){let body=`<div class="grid"><div class="card"><h3>Unit theory</h3>${field('unit_relationship','Specific causal relationship being explained')}${field('unit_constructs','Focal constructs')}${field('unit_mechanism','Proposed mechanism / because-logic')}${field('unit_predictions','Predictions that follow')}</div><div class="card"><h3>Programmatic theory</h3>${field('prog_domain','Broader settled or accepted knowledge')}${field('prog_theories','Existing theories supported, extended, challenged, pruned, or integrated')}${yesNo('prog_clarify','Does it clarify the conversation rather than add complexity?')}${yesNo('prog_coherence','Does it improve coherence?')}${yesNo('prog_parsimony','Does it improve parsimony?')}</div></div><div class="card soft"><h3>Concept map</h3><div class="flow">${['intake_phenomenon','prog_domain','unit_relationship','unit_mechanism','unit_predictions','intake_candidate'].map((k,i)=>`<div class="node">${esc(val(k)||['Focal phenomenon','Programmatic theory','Unit theory','Mechanism','Predictions','Contribution'][i])}</div>${i<5?'<div class="arrow">→</div>':''}`).join('')}</div></div>`;return moduleShell('4. Unit Theory and Programmatic Theory Mapper','Locate the project simultaneously in a specific causal explanation and the broader theoretical conversation.',body)}
function renderNeed(){let qs=[['need_matters','Addresses a problem that matters'],['need_problem','Improves a problematic situation'],['need_predict','Improves prediction beyond existing explanations'],['need_vars','Identifies useful explanatory variables'],['need_question','Answers a relevant unanswered question'],['need_noLaundry','Avoids adding one more mediator/moderator to a crowded list'],['need_reduce','Reduces confusion'],['need_parsimony','Increases parsimony'],['need_coherence','Increases coherence'],['need_notTooMuch','Is not too much, too many, or merely novel']];let yes=qs.filter(q=>state[q[0]]).length;let rec=needRec();let body=`<div class="grid">${qs.map(([k,l])=>check(k,l)).join('')}</div><div class="card soft"><h3>Recommendation</h3><p><span class="status ${yes>=8?'good':yes>=5?'warn':'bad'}">${rec}</span></p><p class="hint">A new theory is more defensible when it matters, improves prediction or explanation, and clarifies rather than bloats the programmatic theory.</p></div>`;return moduleShell('5. “Is New Theory Needed?” Decision Tool','Determine whether the idea warrants new theory, theory elaboration, theory testing, or pruning.',body)}
function needRec(){let s=['need_matters','need_problem','need_predict','need_vars','need_question','need_noLaundry','need_reduce','need_parsimony','need_coherence','need_notTooMuch'].filter(k=>state[k]).length;if(s>=8)return 'New theory appears warranted.'; if(s>=6 && state.need_noLaundry)return 'Theory elaboration is more appropriate than an entirely new theory.'; if(s>=4)return 'Theory testing or focused elaboration may be more appropriate than new theory.'; if(s>=2)return 'The idea needs pruning, simplification, or reframing.'; return 'The theoretical contribution is currently too weak.'}
function renderPruning(){let body=`<div class="card"><h3>Alternative Explanations Table</h3><table><thead><tr><th>Current explanation</th><th>Competing explanation</th><th>What each predicts</th><th>Evidence favoring one</th><th>Evidence weakening/eliminating alternative</th></tr></thead><tbody>${[1,2,3].map(i=>`<tr><td>${field('alt'+i+'_cur','', 'textarea')}</td><td>${field('alt'+i+'_comp','', 'textarea')}</td><td>${field('alt'+i+'_pred','', 'textarea')}</td><td>${field('alt'+i+'_fav','', 'textarea')}</td><td>${field('alt'+i+'_elim','', 'textarea')}</td></tr>`).join('')}</tbody></table></div><div class="grid"><div class="card"><h3>Falsification versus failed confirmation</h3>${yesNo('fals_merely','Does the study merely show that a hypothesis did not work?')}${yesNo('fals_wrong','Does it identify what is wrong with the theory?')}${yesNo('fals_compare','Does it compare plausible alternatives?')}${yesNo('fals_eliminate','Does it eliminate alternative explanations?')}${yesNo('fals_horserace','Does it put competing theories into a fair horse race?')}</div><div class="card"><h3>Strong Inference Planner</h3>${field('si_A','Theory A prediction')}${field('si_B','Theory B prediction')}${field('si_outcome','Shared outcome')}${field('si_evidence','Discriminating evidence')}${field('si_design','Design needed to adjudicate')}</div></div><div class="card soft"><h3>Theory Pruning Plan</h3><p>${prunePlan()}</p></div>`;return moduleShell('6. Theory Pruning and Falsification Lab','Design studies that reduce confusion by comparing plausible alternatives rather than merely confirming one more explanation.',body)}
function prunePlan(){if(val('si_A')||val('si_B'))return `Pit the focal explanation against plausible alternatives by using ${val('si_outcome')||'a shared outcome'} and evidence that can discriminate between: ${val('si_A')||'Theory A'} and ${val('si_B')||'Theory B'}. The design should measure rival mechanisms and specify what evidence would weaken or eliminate each alternative.`;return 'Enter competing predictions and discriminating evidence to generate a pruning plan.'}
function renderPrecision(){let body=`<div class="grid">${field('prec_directional','Current directional prediction')}${field('prec_nonNil','Non-nil prediction: expected nonzero effect or range')}${field('prec_lower','Lower bound: value below which effect is theoretically trivial','text')}${field('prec_upper','Upper bound: maximum value expected on conceptual grounds','text')}${field('prec_range','Expected range / good-enough belt','text')}${field('prec_comparative','Comparative prediction: which effect is larger/smaller/stronger/weaker/faster/slower?')}${field('prec_moderators','Moderators influencing strength or direction')}${field('prec_shape','Linear versus curvilinear prediction','select',['Unclear','Linear','Curvilinear','Threshold','Asymmetric','Nonlinear, form TBD'])}${field('prec_time','Temporal sequencing')}${field('prec_boundaries','Boundary conditions')}${field('prec_risk','Evidence needed to put theory at genuine risk')}</div><div class="card soft"><h3>Refined proposition / hypothesis draft</h3><p>${precisionDraft()}</p></div>`;return moduleShell('7. Theoretical Precision Builder','Move beyond vague directional hypotheses by specifying range, comparison, shape, boundary conditions, timing, and risk.',body)}
function precisionDraft(){let c=val('intake_constructs')||'[constructs]';let o=val('intake_outcome')||'[outcome]';let mech=val('unit_mechanism')||'[mechanism]';let dir=val('prec_directional')||'[expected direction]';let range=val('prec_range')||val('prec_nonNil')||'[expected non-nil range]';let bounds=val('prec_boundaries')||'[boundary conditions]';let time=val('prec_time')||'[temporal sequence]';return `Proposition/Hypothesis: ${c} will be associated with ${o} in the ${dir} because ${mech}. The effect is expected to fall within ${range}, particularly under ${bounds}, and should unfold through ${time}. Evidence outside this range or inconsistent with this mechanism would place the theory at risk.`}
function renderRoute(){let body=`<div class="grid3"><div class="card"><h3>Theory generation</h3><p>Input: unexplained phenomenon or little existing theory.</p><p>Process: induct or derive constructs and relationships.</p><p>Output: new propositions or constructs.</p></div><div class="card"><h3>Theory testing</h3><p>Input: formal hypotheses from existing theory.</p><p>Process: collect/analyze evidence for hypothesized relationships.</p><p>Output: support or rejection of hypotheses.</p></div><div class="card"><h3>Theory elaboration</h3><p>Input: partially explained phenomenon and existing conceptual model.</p><p>Process: use existing concepts to organize data and refine theory.</p><p>Output: refined contexts, constructs, and relationships.</p></div></div><div class="grid">${yesNo('route_little','Is there little to no existing theory?')}${yesNo('route_hyp','Are there formal hypotheses from extant theory?')}${yesNo('route_partial','Is the phenomenon partially explained?')}${yesNo('route_model','Is there an existing conceptual model?')}${yesNo('route_ambiguity','Is the current explanation ambiguous, controversial, or inadequate?')}${yesNo('route_data','Can additional data be integrated with existing theory?')}</div><div class="card soft"><h3>Recommended route</h3><p><span class="status ${routeRec().cls}">${routeRec().label}</span></p><p>${routeRec().text}</p></div>`;return moduleShell('8. Theory Generation, Testing, or Elaboration Route Selector','Choose the most defensible theorizing route for the state of knowledge and available evidence.',body)}
function routeRec(){if(val('route_little')==='Yes')return {label:'Theory generation',cls:'good',text:'Use this route when the phenomenon is not adequately theorized and new constructs or relationships must be developed.'};if(val('route_partial')==='Yes'&&val('route_model')==='Yes'&&val('route_ambiguity')==='Yes'&&val('route_data')==='Yes')return {label:'Theory elaboration',cls:'good',text:'Use current theory as a scaffold, then contrast, specify, or structure constructs and relations using additional data.'};if(val('route_hyp')==='Yes'&&val('route_ambiguity')==='No')return {label:'Theory testing',cls:'good',text:'The main task is empirical scrutiny of formal hypotheses rather than elaborating or generating theory.'};return {label:'Undetermined / needs clarification',cls:'warn',text:'Clarify whether the domain lacks theory, contains testable hypotheses, or has an inadequate explanation that can be refined with data.'}}
function renderElaboration(){let rec=elabRec();let body=`<div class="tree"><div class="q">${yesNo('elab_q1','Q1: Existing theory and access to data?')}</div><div class="rec">No → adopt theory development.</div><div class="q">${yesNo('elab_q2','Q2: Existing explanation controversial, ambiguous, or inadequate?')}</div><div class="rec">No → adopt theory testing.</div><div class="q">${yesNo('elab_q3','Q3: Potential to collect additional data to integrate with existing theory?')}</div><div class="rec">No → adopt deductive theory development.</div></div><div class="card soft"><h3>Decision-tree result</h3><p><span class="status ${rec.cls}">${rec.label}</span></p><p>${rec.text}</p></div>`;return moduleShell('9. Theory Elaboration Decision Tree','Apply the three-question decision process for choosing whether theory elaboration is viable.',body)}
function elabRec(){let q1=val('elab_q1'),q2=val('elab_q2'),q3=val('elab_q3');if(q1==='No')return {label:'Theory development',cls:'warn',text:'Because existing theory or relevant data access is absent, first develop theory rather than elaborate it.'};if(q1==='Yes'&&q2==='No')return {label:'Theory testing',cls:'good',text:'Existing theory appears sufficient; formal hypotheses and empirical scrutiny are likely more appropriate.'};if(q1==='Yes'&&q2==='Yes'&&q3==='No')return {label:'Deductive theory development',cls:'warn',text:'There is a theory problem, but additional integrative data are not available.'};if(q1==='Yes'&&q2==='Yes'&&q3==='Yes')return {label:'Theory elaboration',cls:'good',text:'All three conditions are met. Proceed by selecting contrasting, construct specification, and/or structuring tactics.'};return {label:'Incomplete decision',cls:'bad',text:'Answer all three questions to generate a route.'}}
function renderScorecard(){let body=`<div class="grid">${fiveCriteria.map(([k,t,d,rec])=>`<div class="card"><h3>${t}</h3><p class="hint">${d}</p>${rangeField('score_'+k,'Rating')}${field('evidence_'+k,'Evidence supporting this criterion','textarea')}${field('weak_'+k,'Weakness or gap','textarea')}<p class="callout">Recommended improvement: ${rec}</p></div>`).join('')}</div><div class="card soft"><h3>Ranked contribution areas</h3><p>${rankedCriteria()}</p></div>`;return moduleShell('10. Five Ways to Advance Theory Scorecard','Score and improve the five main ways a study can advance theory.',body)}
function rankedCriteria(){let arr=fiveCriteria.map(([k,t])=>[t,Number(state['score_'+k]??2)]).sort((a,b)=>b[1]-a[1]);return `Strongest: ${arr.slice(0,2).map(x=>x[0]+' ('+x[1]+'/4)').join(', ')}.\nWeakest: ${arr.slice(-2).reverse().map(x=>x[0]+' ('+x[1]+'/4)').join(', ')}.`}
function renderTactics(){let body=`<div class="grid"><div class="card"><h3>Contribution needs</h3>${check('need_logical','Improve logical and/or empirical validity')}${check('need_construct','Improve construct validity and/or scope')}${check('need_explain','Improve explanatory and predictive adequacy')}</div><div class="card"><h3>Select conditions that apply</h3>${tacticChecks.map(t=>check('tactic_'+t[0],t[1],t[2])).join('')}</div></div><div class="card soft"><h3>Recommended implementation approach and tactics</h3><p>${tacticRec()}</p></div><details><summary>Approach-to-purpose map</summary><ul><li><strong>Contrasting</strong>: improves logical and empirical adequacy by comparing contexts or levels.</li><li><strong>Construct specification</strong>: improves construct validity and scope by defining new constructs or splitting broad constructs.</li><li><strong>Structuring</strong>: improves explanatory and predictive adequacy by specifying relations, sequences, or recursive structures.</li></ul></details>`;return moduleShell('11. Implementation Approaches and Seven Tactics Selector','Map theory-advancement needs to the correct implementation approach and specific tactics.',body)}
function tacticRec(){let rec=[];if(state.need_logical||state.tactic_horiz||state.tactic_vert){let tactics=[];if(state.tactic_horiz)tactics.push('horizontal contrasting');if(state.tactic_vert)tactics.push('vertical contrasting');rec.push(`Contrasting${tactics.length?' through '+tactics.join(' and '):''} to improve logical and empirical adequacy.`)}if(state.need_construct||state.tactic_newSpec||state.tactic_split){let tactics=[];if(state.tactic_newSpec)tactics.push('new specification');if(state.tactic_split)tactics.push('construct splitting');rec.push(`Construct specification${tactics.length?' through '+tactics.join(' and '):''} to improve construct validity and scope.`)}if(state.need_explain||state.tactic_specificRel||state.tactic_sequence||state.tactic_recursive){let tactics=[];if(state.tactic_specificRel)tactics.push('specific relations');if(state.tactic_sequence)tactics.push('sequence relations');if(state.tactic_recursive)tactics.push('recursive relations');rec.push(`Structuring${tactics.length?' through '+tactics.join(', '):''} to improve explanatory and predictive adequacy.`)}return rec.length?rec.join('\n'):'Select contribution needs and applicable conditions to generate a tactic recommendation.'}
function renderLevels(){let body=`<div class="grid">${field('level_individual','Individual-level constructs')}${field('level_team','Team/group-level constructs')}${field('level_org','Organization-level constructs')}${field('level_macro','Industry/field/country-level constructs')}${field('level_cross','Cross-level mechanisms')}${field('level_bottom','Bottom-up processes')}${field('level_top','Top-down processes')}${field('level_emergent','Emergent processes')}${field('level_recursive','Recursive cross-level processes')}${yesNo('level_one','Does the theory address only one level even though the problem operates across levels?')}${yesNo('level_discrep','Are there discrepancies between micro and macro findings?')}${yesNo('level_terms','Are terminology differences hiding conceptual similarities?')}${yesNo('level_pract','Are practitioners facing the issue across levels?')}${field('level_methods','Design, measurement, or analytic approach to bridge levels','textarea')}${field('level_option','Methodological option','select',['Undetermined','Multilevel design','Systematic review','Simulation','Policy capturing','Conjoint analysis','Mixed methods','Longitudinal cross-level design','Other'])}</div><div class="card soft"><h3>Levels of Analysis Integration Statement</h3><p>${levelsStatement()}</p></div>`;return moduleShell('12. Bridging Levels of Analysis','Identify whether the research problem spans micro, meso, and macro levels and what methodological bridge is needed.',body)}
function levelsStatement(){let parts=[val('level_individual')&&`individual-level constructs (${val('level_individual')})`,val('level_team')&&`team/group constructs (${val('level_team')})`,val('level_org')&&`organizational constructs (${val('level_org')})`,val('level_macro')&&`macro constructs (${val('level_macro')})`].filter(Boolean);if(!parts.length)return 'Map constructs at each relevant level to generate an integration statement.';return `This project can bridge levels of analysis by linking ${parts.join(', ')} through ${val('level_cross')||'specified cross-level mechanisms'}. The design should examine ${val('level_bottom')||'bottom-up'}, ${val('level_top')||'top-down'}, and ${val('level_recursive')||'recursive'} processes using ${val('level_option')||val('level_methods')||'a defensible multilevel or mixed-method design'}.`}
function renderMethods(){let body=`<div class="grid">${field('meth_design','Best research design')}${field('meth_measure','Construct measurement needs')}${field('meth_data','Data sources needed')}${field('meth_logic','Qualitative, quantitative, or mixed-methods logic','select',['Undetermined','Qualitative','Quantitative','Mixed methods','Sequential mixed methods','Longitudinal quantitative','Comparative case design'])}${field('meth_sampling','Sampling implications')}${field('meth_time','Time / longitudinal requirements')}${field('meth_compare','Comparison groups or contexts')}${field('meth_alt','Alternative explanations to measure')}${field('meth_level','Level-of-analysis requirements')}${field('meth_evidence','What would count as meaningful evidence')}${field('meth_risk','What would put the theory at risk')}</div><div class="card soft"><h3>Generated methodological implications</h3><p>${methodImplications()}</p></div>`;return moduleShell('13. Methodological Implications Generator','Translate the theoretical contribution into design, measurement, data, sampling, temporal, comparison, and risk requirements.',body)}
function methodImplications(){return `Design: ${val('meth_design')||'Specify a design that can observe the focal mechanism and adjudicate among alternatives.'}\nMeasurement: ${val('meth_measure')||'Define constructs precisely and distinguish them from adjacent constructs.'}\nData: ${val('meth_data')||'Collect evidence that captures constructs, mechanisms, timing, and rival explanations.'}\nLogic: ${val('meth_logic')||'Choose qualitative, quantitative, or mixed methods based on whether the task is discovery, testing, elaboration, or falsification.'}\nSampling/comparison: ${val('meth_sampling')||'Sample cases, contexts, or units that make theoretical variation visible.'} ${val('meth_compare')||''}\nTime/levels: ${val('meth_time')||'Use longitudinal evidence if sequence or recursion matters.'} ${val('meth_level')||''}\nRisk: ${val('meth_risk')||val('prec_risk')||'State what evidence would weaken or falsify the theory.'}`}
function contributionSentence(){let domain=val('intake_domain')||'[target literature]';let phen=val('intake_phenomenon')||'[phenomenon]';let mechanism=val('unit_mechanism')||'[mechanism]';let contrib=tacticRec().split('\n')[0]||val('intake_candidate')||'[contribution]';return `This study contributes to ${domain} by explaining ${phen} through ${mechanism} and by advancing theory via ${contrib.toLowerCase()}`.replace(/\.$/,'')+'.'}
function contributionParagraph(){return `This study enters the ${val('intake_domain')||'[target literature]'} conversation by addressing the unresolved puzzle of ${val('intake_unknown')||'[what remains unexplained]'}. Existing theory explains ${val('intake_currentTheory')||'[current explanation]'}, but it does not yet adequately account for ${val('intake_problem')||'[the focal problem]'}. The proposed unit theory explains the relationship between ${val('unit_constructs')||val('intake_constructs')||'[focal constructs]'} and ${val('intake_outcome')||'[outcome]'} because ${val('unit_mechanism')||'[mechanism]'}. The contribution is meaningful because it improves ${topContributionDimension()} and clarifies how the unit theory fits within ${val('prog_domain')||'[programmatic theory]'}. It also matters to ${val('intake_audience')||'[stakeholders]'} because ${val('intake_matters')||'[reason it matters]'}.`}
function topContributionDimension(){let arr=fiveCriteria.map(([k,t])=>[t,Number(state['score_'+k]??2)]).sort((a,b)=>b[1]-a[1]);return arr[0][0].toLowerCase()+', '+arr[1][0].toLowerCase();}
function reviewerDefense(){return `This is not merely a context extension, an added mediator/moderator, or an empirical application. The study addresses a specific theory problem: ${val('intake_unknown')||'[unresolved gap]'}. It clarifies the relationship between unit theory and programmatic theory by ${val('prog_theories')||'[explaining how it supports, extends, challenges, prunes, or integrates existing theory]'}. The design is theory-relevant because it can examine ${val('meth_evidence')||val('si_evidence')||'[meaningful evidence]'} and can place the theory at risk through ${val('meth_risk')||val('prec_risk')||'[risk criteria]'}.`}
function abstractVersion(){return `This study examines ${val('intake_phenomenon')||'[phenomenon]'} in order to address ${val('intake_problem')||'[problem/puzzle]'}. Building on ${val('prog_domain')||'[programmatic theory]'}, it develops a unit-theoretical explanation linking ${val('intake_constructs')||'[constructs]'} to ${val('intake_outcome')||'[outcome]'} through ${val('unit_mechanism')||'[mechanism]'}. The study advances theory by improving ${topContributionDimension()} and by using ${val('meth_logic')||'[methodological logic]'} evidence to clarify ${val('intake_unknown')||'[what remains unknown]'}. In doing so, the project aims to strengthen explanation, prediction, and practical relevance for ${val('intake_audience')||'[stakeholders]'}.`}
function renderStatements(){let body=`<div class="card"><h3>One-sentence theory contribution</h3><textarea data-key="out_sentence">${esc(val('out_sentence')||contributionSentence())}</textarea></div><div class="card"><h3>Full theory contribution paragraph</h3><textarea data-key="out_paragraph">${esc(val('out_paragraph')||contributionParagraph())}</textarea></div><div class="card"><h3>Reviewer-ready justification</h3><textarea data-key="out_defense">${esc(val('out_defense')||reviewerDefense())}</textarea></div><div class="card"><h3>Abstract-ready version</h3><textarea data-key="out_abstract">${esc(val('out_abstract')||abstractVersion())}</textarea></div><div class="card"><h3>Proposition / hypothesis builder</h3>${precisionDraft()}</div>`;return moduleShell('14. Contribution Statement Generator','Generate manuscript-ready language that can be edited, copied, and inserted into papers, proposals, and reviewer responses.',body)}
function renderReport(){let body=`<div class="toolbar no-print" style="justify-content:flex-start;margin:8px 0 16px"><button onclick="refreshGeneratedOutputs()">Refresh generated language</button><button class="secondary" onclick="window.print()">Print this report</button></div><div class="report" id="finalReport">${reportHTML()}</div>`;return moduleShell('15. Final Theory Contribution Report','Compile the full project into a clean report suitable for a memo, proposal, manuscript-development file, or reviewer response.',body)}

function renderAbout(){return `<div class="card soft"><h3>About this tool</h3><p>This interactive tool operationalizes chapter-level guidance on making theory contributions, including usefulness, good theory, unit and programmatic theory, theory pruning, falsification, theoretical precision, theory elaboration, implementation tactics, and bridging levels of analysis.</p><p class="citation"><strong>Source:</strong> Aguinis, H. 2025. <em>Research methodology: Best practices for rigorous, credible, and impactful research.</em> SAGE. https://collegepublishing.sagepub.com/products/research-methodology-1-280088</p></div>`}
